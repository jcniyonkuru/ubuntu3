; Ubuntu 3.0 — Local PHP tuning.
; Anything that's safe to surface in dev but shouldn't run in prod goes here.

display_errors      = On
display_startup_errors = On
error_reporting     = E_ALL
log_errors          = On
html_errors         = On

; UTF-8 / timezone defaults (mirror production).
default_charset     = UTF-8
date.timezone       = UTC

; Reasonable upload caps for testing photo / audio stories locally.
upload_max_filesize = 25M
post_max_size       = 30M
memory_limit        = 256M

; Don't expose the PHP version in headers.
expose_php          = Off
