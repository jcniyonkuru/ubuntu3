# Ubuntu 3.0 — Local-only Apache vhost.
#
# Layout mirrors production:
#   /         → /var/www/app                  (PWA)
#   /admin/   → /var/www/server/public/admin  (admin console — static files)
#   /api/*    → /var/www/server/public         (front-controller PHP)
#
# In production the same routing is achieved by Caddy + the .htaccess in
# server/public/. Here we put the rules inline because:
#   (a) we don't have Caddy locally,
#   (b) the production .htaccess forces HTTPS, which would break local dev.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/app

    # PWA — static + service worker. Allow .htaccess inside app/ if we add one later.
    <Directory /var/www/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Admin static files. The admin is plain HTML/JS, no PHP.
    Alias /admin /var/www/server/public/admin
    <Directory /var/www/server/public/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # API — every /api/* request goes through index.php.
    # We disable AllowOverride here so the production .htaccess (which would
    # force HTTPS and reject our HTTP requests) is ignored locally.
    Alias /api /var/www/server/public
    <Directory /var/www/server/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # If the file/directory doesn't physically exist, hand off to index.php.
        # The PHP front controller reads REQUEST_URI and strips the /api prefix
        # itself — see server/public/index.php.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ /api/index.php [QSA,L]
    </Directory>

    # Verbose logs for the dev console.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
