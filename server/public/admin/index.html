<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#B73B3F" />
  <title>Ubuntu 3.0 — Admin</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <style>
/* Ubuntu 3.0 — Admin web view */
[hidden] { display: none !important; }
:root {
  --brand: #B73B3F;
  --brand-dark: #8C2D31;
  --brand-tint: #FBEDED;
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --text: #1B1B1B;
  --muted: #6B6B6B;
  --border: #E6E6E8;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  --success: #2D8659;
  --warning: #B7791F;
  --danger: #B73B3F;
  --radius: 12px;
  --sidebar-w: 240px;
  --topbar-h: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0 0 12px; }
h2 { font-size: 18px; margin: 16px 0 8px; }
h3 { font-size: 15px; margin: 8px 0 4px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { height: 12px; }
.error { color: var(--danger); background: #FCEAEB; padding: 8px 10px; border-radius: 8px; margin: 0 0 8px; font-size: 13px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--brand); color: #fff;
  border: 0; border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  min-height: 36px;
}
.btn:hover { background: var(--brand-dark); }
.btn--ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn--ghost:hover { background: #F7F7F8; }
.btn--soft { background: var(--brand-tint); color: var(--brand-dark); }
.btn--soft:hover { background: #F5DCDD; }
.btn--danger { background: var(--danger); }
.btn--sm { padding: 6px 10px; min-height: 28px; font-size: 13px; font-weight: 500; }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ---------- login (in-card layout, swapped with trainer PWA) ---------- */
.login {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  z-index: 100;
  overflow-y: auto;
}
.login__topbar {
  height: var(--topbar-h);
  background: var(--brand);
  color: #fff;
  display: flex; align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
}
.login__topbar img { display: block; }
.login__topbar-title { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
.login__topbar-suffix { opacity: .85; font-weight: 600; margin-left: 4px; }
.login__body {
  flex: 1;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px 40px;
}
.login__card {
  background: #fff;
  padding: 22px 22px 20px;
  border-radius: var(--radius);
  width: min(420px, 100%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.login__brand {
  display: flex; align-items: center; justify-content: center;
  padding: 4px 0 12px;
  margin: 0 -4px;
}
.login__logo { display: block; max-width: 60%; max-height: 150px; height: auto; width: auto; }
.login__title { font-size: 18px; font-weight: 700; margin: 0 0 4px; text-align: center; }
.login__sub   { color: var(--muted); font-size: 13px; text-align: center; margin: 0 0 12px; }
.login__card label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
}
.login__card input {
  display: block;
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  margin-top: 4px;
}
.login__card input:focus { outline: none; border-color: var(--brand); }
.login__forgot {
  display: block;
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: var(--brand);
}
.login__hint {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin: 10px 0 0;
}

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--topbar-h);
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px;
  gap: 12px;
}
.topbar__brand {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700;
}
.topbar__brand-suffix { color: var(--brand); font-weight: 600; }
.topbar__right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}
.user-pill {
  background: var(--brand-tint);
  color: var(--brand-dark);
  font-size: 12px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
}
.hamburger {
  display: none;
  background: transparent; border: 0; cursor: pointer;
  padding: 6px; color: var(--text);
}

/* ---------- layout ---------- */
.layout { display: flex; min-height: calc(100vh - var(--topbar-h)); }
.sidebar {
  width: var(--sidebar-w);
  background: #fff;
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  display: flex; flex-direction: column; gap: 2px;
  flex-shrink: 0;
}
.nav-item {
  display: block;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--text);
  font-weight: 500;
}
.nav-item:hover { background: var(--bg); text-decoration: none; }
.nav-item.active {
  background: var(--brand-tint);
  color: var(--brand-dark);
}
.main { flex: 1; padding: 20px 24px; min-width: 0; }

/* ---------- KPI banner ---------- */
.kpis {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
@media (min-width: 720px) {
  .kpis { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
}
.kpi {
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: 0 6px 20px rgba(183, 59, 63, 0.25);
}
.kpi__label {
  color: rgba(255,255,255,.85);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 600;
}
.kpi__value { font-size: 32px; font-weight: 700; line-height: 1; margin: 6px 0 4px; }
.kpi__sub   { color: rgba(255,255,255,.85); font-size: 13px; }
.kpi__bar {
  background: rgba(255,255,255,.25);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 10px;
}
.kpi__bar-fill { background: #fff; height: 100%; }

/* ---------- tiles ---------- */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.tile {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease;
}
.tile__label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.tile__value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.tile--link {
  display: block;
  text-decoration: none;
  color: inherit;
}
.tile--link::after {
  content: "›";
  float: right;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
  margin-top: -2px;
}
.tile--link:hover {
  border-color: var(--brand-tint);
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  text-decoration: none;
}
.tile--link:active { transform: translateY(1px); }

/* ---------- cards & tables ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.card__head h2 { margin: 0; }

.table-wrap { overflow-x: auto; }
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data th, table.data td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
table.data tr:hover td { background: #FAFAFB; }
table.data td .pill { font-size: 11px; }
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: #EEE; color: var(--muted);
}
.pill--brand    { background: var(--brand-tint); color: var(--brand-dark); }
.pill--success  { background: #DDEEE3; color: #1E5C3D; }
.pill--warning  { background: #FBE9CC; color: #7A4F00; }
.pill--danger   { background: #FCEAEB; color: var(--brand-dark); }

.empty {
  text-align: center; padding: 32px 16px; color: var(--muted);
}

/* ---------- form ---------- */
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.form-group input, .form-group select {
  width: 100%;
  padding: 9px 11px;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--brand); }

/* ---------- modal ---------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
  padding: 20px;
}
.modal {
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  width: min(420px, 100%);
  max-height: 80vh;
  overflow: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,.3);
}
.modal h2 { margin-top: 0; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: #1B1B1B; color: #fff;
  padding: 10px 14px; border-radius: 999px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
  z-index: 100;
}

/* ---------- responsive ---------- */
@media (max-width: 760px) {
  .hamburger { display: inline-flex; }
  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
    transform: translateX(-100%);
    transition: transform .15s ease;
    z-index: 30;
    box-shadow: 0 8px 24px rgba(0,0,0,.1);
  }
  .sidebar.open { transform: translateX(0); }
  .main { padding: 16px; }
  .topbar__brand-suffix { display: none; }
}

/* ---------- reports — story cards ---------- */
.story-card {
  display: flex; gap: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  margin: 8px 0;
  background: #FAFAFB;
  page-break-inside: avoid;
}
.story-card__photo {
  width: 120px; height: 120px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
}
.story-card__body { flex: 1; min-width: 0; }

/* Print header only visible when printing */
.print-header { display: none; }

/* ---------- print (Save as PDF) ---------- */
@media print {
  /* hide everything we don't want in the donor report */
  .topbar, .sidebar, .hamburger, .no-print, .toast, #login { display: none !important; }
  .layout, .main { display: block; padding: 0; min-height: 0; }
  body { background: #fff; }
  /* Print header at the top of every page */
  .print-header {
    display: block;
    text-align: center;
    border-bottom: 2px solid var(--brand);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .print-header__title { font-size: 18px; font-weight: 700; color: var(--brand-dark); }
  .print-header__sub   { font-size: 12px; color: #6B6B6B; margin-top: 4px; }
  /* Cards become plain page sections */
  .card {
    border: 0;
    box-shadow: none;
    padding: 0;
    margin: 12px 0 18px;
    page-break-inside: avoid;
  }
  .card h2 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  /* KPI banner shrinks to fit on paper */
  .kpis { grid-template-columns: repeat(4, 1fr) !important; gap: 8px; }
  .kpi { padding: 10px 12px; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .kpi__value { font-size: 22px; }
  /* Tables — ensure they print readably */
  table.data, table.data th, table.data td {
    color: #000 !important;
    background: #fff !important;
    border-color: #ccc !important;
  }
  table.data th { background: #f4f4f6 !important; }
  /* Force colour for branded pills/bars */
  .pill, .kpi, .pill--brand, .pill--success, .pill--warning, .pill--danger {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  /* New page before "By cohort" and "Selected stories" */
  #reports-result .card:nth-of-type(4),
  #reports-result .card:nth-of-type(6) { page-break-before: always; }
}

  </style>
</head>
<body>
  <!-- Login (in-card layout) -->
  <div id="login" class="login" hidden>
    <header class="login__topbar">
      <img src="/icon-192.png" alt="" width="28" height="28" />
      <span class="login__topbar-title">Ubuntu 3.0<span class="login__topbar-suffix">  Admin</span></span>
    </header>
    <div class="login__body">
      <form id="login-form" class="login__card" autocomplete="on">
        <div class="login__brand">
          <img src="/logo.png" alt="Académie Ubuntu" class="login__logo" />
        </div>
        <h2 class="login__title">Administrator log in</h2>
        <p class="login__sub">Manage cohorts, users, sessions and stories.</p>
        <p id="login-error" class="error" hidden></p>
        <label>Username or email
          <input name="email" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" />
        </label>
        <label>Password
          <input name="password" type="password" required autocomplete="current-password" />
        </label>
        <button class="btn btn--primary btn--block" type="submit" id="login-btn">Log in</button>
        <a id="login-forgot" class="login__forgot" href="#forgot">Forgot password?</a>
        <p class="login__hint">You can also use your Ubuntu eLearning credentials.</p>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" hidden>
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
      </button>
      <div class="topbar__brand">
        <img src="/icon-192.png" alt="" width="28" height="28" />
        <span>Ubuntu 3.0 <span class="topbar__brand-suffix">Admin</span></span>
      </div>
      <div class="topbar__right">
        <button class="btn btn--ghost btn--sm" id="refresh-btn" title="Refresh from server" aria-label="Refresh">↻ Refresh</button>
        <span class="user-pill" id="user-pill"></span>
        <button class="btn btn--ghost btn--sm" id="logout-btn">Log out</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Sections">
        <a href="#dashboard"    data-section="dashboard"    class="nav-item">Dashboard</a>
        <a href="#users"        data-section="users"        class="nav-item">Staff</a>
        <a href="#trainees"     data-section="trainees"     class="nav-item">Trainees</a>
        <a href="#cohorts"      data-section="cohorts"      class="nav-item">Cohorts</a>
        <a href="#groups"       data-section="groups"       class="nav-item">Courses</a>
        <a href="#participants" data-section="participants" class="nav-item">Participants</a>
        <a href="#sessions"     data-section="sessions"     class="nav-item">Sessions</a>
        <a href="#stories"      data-section="stories"      class="nav-item">Stories</a>
        <a href="#reports"      data-section="reports"      class="nav-item">Reports</a>
      </nav>

      <main class="main" id="main"></main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="admin.js" defer></script>
</body>
</html>
